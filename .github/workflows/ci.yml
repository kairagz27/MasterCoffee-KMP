name: Verify Master Coffee
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coffee
          POSTGRES_PASSWORD: ci-local-database
          POSTGRES_DB: mastercoffee_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coffee -d mastercoffee_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://coffee:ci-local-database@localhost:5432/mastercoffee_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format, vet, unit and real PostgreSQL integration tests
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
  contract-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openapi-spec-validator==0.7.2
      - run: python -m openapi_spec_validator docs/openapi.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test admin/tests/*.test.mjs
      - run: docker compose --env-file .env.example config --quiet
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Common KMP tests on JVM and Android debug APK
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: mastercoffee-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - name: Customer to staff to delivered order
        env:
          DEMO_PASSWORD: LocalCoffee-2026!
        run: node scripts/e2e.mjs
      - name: Restart with preserved volumes
        run: |
          sh scripts/verify-persistence.sh
          sh scripts/backup.sh
          sh scripts/restore-check.sh "$(ls -t backups/*.dump | head -n 1)" mastercoffee_restore_ci
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
