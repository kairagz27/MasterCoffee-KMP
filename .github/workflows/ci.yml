name: Verify Master Coffee
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coffee
          POSTGRES_PASSWORD: ci-local-database
          POSTGRES_DB: mastercoffee_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coffee -d mastercoffee_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://coffee:ci-local-database@localhost:5432/mastercoffee_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format, vet, unit and real PostgreSQL integration tests
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
  contract-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openapi-spec-validator==0.7.2
      - run: python -m openapi_spec_validator docs/openapi.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test admin/tests/*.test.mjs
      - run: docker compose --env-file .env.example config --quiet
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Common tests, Android Lint, debug app and UI test APK
        run: >-
          ./gradlew :composeApp:testDebugUnitTest :composeApp:lintDebug
          :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest
          --console=plain --max-workers=2
      - name: Preserve emulator app and test APKs before URL changes
        run: |
          mkdir -p artifacts/android-emulator
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk artifacts/android-emulator/app.apk
          cp composeApp/build/outputs/apk/androidTest/debug/composeApp-debug-androidTest.apk artifacts/android-emulator/tests.apk
      - name: Release HTTPS configuration, Lint and R8 compilation
        # localhost is a compilation fixture, not a production API or a runtime success claim.
        run: >-
          ./gradlew :composeApp:lintRelease :composeApp:assembleRelease
          -PmasterCoffeeApiUrl=https://localhost/api/v1 --console=plain --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"
      - name: Build USB phone debug APK
        run: |
          ./gradlew :composeApp:assembleDebug -PmasterCoffeeApiUrl=http://127.0.0.1:8080/api/v1 --console=plain --max-workers=2
          mkdir -p artifacts/android-phone
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk artifacts/android-phone/composeApp-phone-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mastercoffee-android-debug
          path: artifacts/android-phone/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mastercoffee-android-instrumentation
          path: artifacts/android-emulator/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastercoffee-android-build-reports
          path: |
            composeApp/build/reports/
            composeApp/build/test-results/
            composeApp/build/outputs/mapping/release/
  android-ui:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: mastercoffee-android-instrumentation
          path: artifacts/android-emulator
      - name: Start real local backend on a fresh database
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Enable KVM for the isolated CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 Compose UI and live backend order workflow
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RUN_BACKEND_E2E: 'true'
          RUN_LAUNCH_SMOKE: 'true'
          DEMO_PASSWORD: LocalCoffee-2026!
          ANDROID_API_URL: http://10.0.2.2:8080/api/v1
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          heap-size: 256M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: sh scripts/run-instrumentation.sh artifacts/android-emulator/app.apk artifacts/android-emulator/tests.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mastercoffee-android-ui-evidence
          path: artifacts/android-ui/
      - name: Backend logs and stop
        if: always()
        run: |
          docker compose logs --tail=60
          docker compose down
  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - name: Customer to staff to delivered order
        env:
          DEMO_PASSWORD: LocalCoffee-2026!
        run: node scripts/e2e.mjs
      - name: Restart with preserved volumes
        run: |
          sh scripts/verify-persistence.sh
          sh scripts/backup.sh
          sh scripts/restore-check.sh "$(ls -t backups/*.dump | head -n 1)" mastercoffee_restore_ci
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
