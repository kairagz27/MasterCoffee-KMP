# Separate future deployment template. Never starts a local plaintext DB.
# Do not combine this file with the development compose.yaml.
name: mastercoffee-https
services:
  api:
    build: ../backend
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      HTTP_ADDR: :8080
      AUTO_MIGRATE: "false"
      SEED_DEMO: "false"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set the actual HTTPS origin owned by the deployment}
      UPLOAD_DIR: /data/uploads
    secrets: [database_url, database_ca]
    volumes: [uploads:/data/uploads]
    restart: unless-stopped
  admin:
    build: ../admin
    ports: ["${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"]
    volumes: [./nginx.https.conf:/etc/nginx/conf.d/default.conf:ro]
    secrets: [tls_certificate, tls_private_key]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:?Absolute path to a private PostgreSQL URL file}
  database_ca:
    file: ${DATABASE_CA_FILE:?Absolute path to the PostgreSQL certificate authority file}
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:?Absolute path to a certificate valid for PUBLIC_ORIGIN}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE:?Absolute path to the matching private key}
volumes:
  uploads:
