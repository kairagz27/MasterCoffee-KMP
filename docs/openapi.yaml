          "default": {
            "description": "JSON error; 400 malformed/unknown fields, 401 invalid session, 403 role/cafe, 404 missing resource, 409 business conflict, 410 expired QR, 413 limit, 415 media, 422 validation, 429 auth throttle, 500 internal, 503 database, 504 timeout.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "before",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          }
        ]
      }
    },
