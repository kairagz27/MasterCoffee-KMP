    "title": "Master Coffee local MVP API",
    "version": "1.0.0",
    "description": "Cash-register payment, server-authoritative KZT prices, PostgreSQL sessions/orders and cafe scoped staff operations. All timestamps UTC. Email is unverified; no online payment provider, MC Coins, promo or referral claims.",
    "license": {
      "name": "Private project"
    }
  },
