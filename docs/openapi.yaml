    "/api/v1/staff/orders/{id}/payment": {
      "post": {
        "operationId": "post_19",
        "summary": "Cashier confirms actual payment at register",
        "tags": [
          "Staff"
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
