                }
              }
            }
          },
          "default": {
            "description": "JSON error; 400 malformed/unknown fields, 401 invalid session, 403 role/cafe, 404 missing resource, 409 business conflict, 410 expired QR, 413 limit, 415 media, 422 validation, 429 auth throttle, 500 internal, 503 database, 504 timeout.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "qr_token": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "description": "Payment status is separate. Empty body object permits authenticated order number fallback. qr_token binds scanned QR and checks expiry/single use; accepts raw token or payload. Repeating number-based payment is idempotent; repeating QR-bound payment409."
      }
    },
    "/api/v1/staff/orders/{id}/status": {
      "patch": {
        "operationId": "patch_20",
        "summary": "Apply one permitted preparation transition",
        "tags": [
          "Staff"
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
