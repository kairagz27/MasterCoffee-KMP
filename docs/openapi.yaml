      }
    },
    "/api/v1/orders": {
      "post": {
        "operationId": "post_11",
        "summary": "Create order atomically from reviewed quote",
        "tags": [
          "Customers"
        ],
        "responses": {
          "200": {
            "description": "Previously created order for same key and quote.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Order"
                }
              }
            }
          },
          "201": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Order"
                }
              }
            }
          },
          "default": {
            "description": "JSON error; 400 malformed/unknown fields, 401 invalid session, 403 role/cafe, 404 missing resource, 409 business conflict, 410 expired QR, 413 limit, 415 media, 422 validation, 429 auth throttle, 500 internal, 503 database, 504 timeout.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "quote_id": {
                    "type": "string"
                  }
                },
                "required": [
                  "quote_id"
                ]
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128
            }
          }
        ],
        "description": "Same key with another quote409. Concurrent equal keys return one order. A quote can create only one order. Price, catalogue snapshot or loyalty change409 requires a fresh quote. Unknown amount fields rejected."
      },
      "get": {
        "operationId": "get_12",
        "summary": "Own descending order history",
        "tags": [
          "Customers"
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OrderPage"
